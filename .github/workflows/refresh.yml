name: Refresh Hotspawn LOL Picks (every 4h)

on:
  schedule:
    - cron: '0 */4 * * *'  # every 4 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run refresh pipeline
        run: |
          python3 scripts/refresh.py
          # Also ensure site builds (link check)
          python3 -c "import json; j=json.load(open('data/picks.json')); assert j['count']==264, 'count mismatch'"
          echo "Refresh completed"

      - name: Check for changes
        id: changes
        run: |
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push if changed
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "hotspawn-bot"
          git config user.email "bot@hotspawn.local"
          git add data/ docs/data/ research/ data/raw/ || true
          git commit -m "refresh: update picks $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]" || echo "no commit"
          git pull --rebase || true
          git push

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.has_changes == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          force_orphan: true

      - name: Summary
        run: |
          echo "### Refresh completed $(date -u)" >> $GITHUB_STEP_SUMMARY
          cat research/refresh_receipt.json 2>/dev/null | head -n 40 >> $GITHUB_STEP_SUMMARY || echo "no receipt yet"
