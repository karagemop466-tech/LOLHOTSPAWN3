name: Refresh picks (every 6h)
on:
  schedule: [{cron: "17 */6 * * *"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Rebuild + timestamp (fixtures/odds re-verified by editors between runs; see COORDINATION.md)
        run: python3 scripts/build.py
      - name: Commit if changed
        run: |
          git config user.name "picks-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A; git diff --cached --quiet || git commit -m "Auto-refresh picks $(date -u +%FT%TZ)"
          git push
