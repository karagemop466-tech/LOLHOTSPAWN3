name: probe
on:
  workflow_dispatch:
  push:
    branches: ["arena/**", "session-*/**"]
    paths: ["scripts/**", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: collect
        run: node scripts/collect.mjs
      - name: diag
        if: always()
        run: node scripts/diag.mjs || true
      - name: commit output
        if: always()
        run: |
          git config user.name "hotspawn-bot"
          git config user.email "hotspawn-bot@users.noreply.github.com"
          git add -A data _probe || true
          git commit -m "probe: collect run [skip ci]" || echo "no changes"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed"
