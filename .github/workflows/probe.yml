name: probe
on:
  workflow_dispatch:
  push:
    branches: ["arena/**", "session-*/**"]
    paths: ["scripts/probe.mjs"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: run probe
        run: node scripts/probe.mjs
      - name: commit output
        run: |
          git config user.name "hotspawn-bot"
          git config user.email "hotspawn-bot@users.noreply.github.com"
          git add -A _probe || true
          git commit -m "probe: capture output [skip ci]" || echo "no changes"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
